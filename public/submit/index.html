<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit an AI tool | AI Directory</title><meta name="description" content="Submit an AI tool for review by the AI Directory team."><link rel="stylesheet" href="/css/app.css"><style>main{max-width:680px;margin:0 auto;padding:32px 16px}form{display:grid;gap:14px}label{display:grid;gap:6px;font-size:13px;font-weight:600}input,textarea,select{font:inherit;padding:10px 12px;border:1px solid #d7dbe2;border-radius:8px;background:#fff;color:#111}textarea{min-height:120px;resize:vertical}button{justify-self:start;border:0;border-radius:8px;padding:10px 16px;background:#111;color:#fff;cursor:pointer}.hint{font-size:12px;opacity:.7}.status{min-height:20px;font-size:13px}</style></head><body><main><nav><a href="/">Home</a> › Submit a tool</nav><h1>Submit an AI tool</h1><p class="hint">All submissions are reviewed before publication. Use the official HTTPS website.</p><form id="f"><label>Name<input name="name" required maxlength="120"></label><label>Official URL<input name="url" type="url" required maxlength="500" placeholder="https://example.com"></label><label>Category<select name="category"><option value="">Choose a category</option><option>Assistants &amp; Agents</option><option>Coding &amp; Dev</option><option>Design &amp; Art</option><option>Video &amp; Animation</option><option>Voice &amp; Sound</option><option>Writing &amp; Content</option><option>Business &amp; Productivity</option><option>Data &amp; Automation</option><option>Education &amp; Research</option><option>Finance</option><option>Health</option><option>Other</option></select></label><label>Short description<textarea name="short_desc" maxlength="500" required></textarea></label><label>Pricing<select name="pricing"><option value="">Not verified</option><option value="free">Free</option><option value="freemium">Freemium</option><option value="paid">Paid</option></select></label><label>Email (optional)<input name="email" type="email" maxlength="200"></label><button>Send for review</button><div class="status" id="s" role="status"></div></form><p><a href="/">← Back to directory</a></p></main><script>const f=document.querySelector('#f'),s=document.querySelector('#s');f.addEventListener('submit',async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));if(!/^https?:\/\//i.test(b.url)){s.textContent='Enter a valid HTTP(S) URL.';return}s.textContent='Sending…';try{const r=await fetch('https://ai-directory-v5-worker.radwanislam648.workers.dev/api/submit-tool',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||'Submission failed');f.reset();s.textContent='Thanks — your submission is pending review.'}catch(err){s.textContent=err.message||'Could not submit right now.'}})</script></body></html>
