<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — AI Directory</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/app.css">
<style>
  .nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
  .nf .em{font-size:48px}
  .nf h1{font-size:22px;margin:0}
  .nf p{color:var(--muted);font-size:13px;max-width:380px;margin:0}
  .nf .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div class="nf">
  <div class="em">🤖</div>
  <h1>Page not found</h1>
  <p>The tool or page you are looking for does not exist. It may have been removed, or the link may be wrong.</p>
  <div class="row">
    <a class="btn p" href="/">← Back to the directory</a>
  </div>
</div>
</body>
</html>
