name: Deploy

# Push to main -> deploy the worker, then publish the Pages site.
# Requires repository secrets: CF_API_TOKEN and CF_ACCOUNT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Deploy worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy worker (D1 binding comes from wrangler.toml)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      # Warm every path the site itself requests, right after each deploy.
      # cacheFetch keeps a week-long second copy of each cached response and
      # serves it when the handler throws, so an exhausted D1 read quota shows
      # yesterday's data instead of "Could not load this section.". That only
      # helps for keys that have been fetched at least once since the deploy,
      # and this site has little traffic - on 13 Sep /api/tools?featured=1 and
      # /api/news had never been warmed, so those two sections still went blank.
      # The params must match public/js/app.js exactly or they warm a different
      # key. Warming also replaces the old /api/stats smoke test.
      - name: Smoke test and warm the cache
        run: |
          sleep 5
          W=https://ai-directory-v5-worker.radwanislam648.workers.dev
          ok=0
          bad=0
          for p in \
            "/api/stats" \
            "/api/categories" \
            "/api/tools?limit=6" \
            "/api/tools?limit=6&sort=newest&days=7" \
            "/api/tools?limit=6&featured=1" \
            "/api/tools?limit=6&pricing=free" \
            "/api/tools/new?limit=8" \
            "/api/tools/trending?limit=6" \
            "/api/free-tools?limit=6" \
            "/api/news?limit=8" \
            "/api/blogs?limit=12" \
            "/api/prompts?limit=12" \
            "/sitemap.xml" \
            "/rss.xml" ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$W$p")
            echo "  $code  $p"
            if [ "$code" = "200" ]; then ok=$((ok+1)); else bad=$((bad+1)); fi
          done
          echo "warmed $ok, not warmed $bad"
          # Best effort. A blocked D1 read quota makes these 500, which is the
          # very thing this step exists to soften - it must not turn the deploy
          # red. Only a deploy where nothing answers at all is a real failure.
          test "$ok" != "0"

  pages:
    name: Publish site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=ai-directory-v5-radwan648 --branch=main
