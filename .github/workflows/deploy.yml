name: Deploy

# Push to main -> deploy the worker, then publish the Pages site.
# Requires repository secrets: CF_API_TOKEN and CF_ACCOUNT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Deploy worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy worker (D1 binding comes from wrangler.toml)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      # Warm every path the site itself requests, right after each deploy.
      # cacheFetch keeps a week-long second copy of each cached response and
      # serves it when the handler throws, so an exhausted D1 read quota shows
      # yesterday's data instead of "Could not load this section.". That only
      # helps for keys that have been fetched at least once since the deploy,
      # and this site has little traffic - on 13 Sep /api/tools?featured=1 and
      # /api/news had never been warmed, so those two sections still went blank.
      # The params must match public/js/app.js exactly or they warm a different
      # key. Warming also replaces the old /api/stats smoke test.
      - name: Smoke test and warm the cache
        run: |
          sleep 5
          W=https://ai-directory-v5-worker.radwanislam648.workers.dev
          ok=0; bad=0; quota=0
          for p in \
            "/api/stats" \
            "/api/categories" \
            "/api/tools?limit=6" \
            "/api/tools?limit=6&sort=newest&days=7" \
            "/api/tools?limit=6&featured=1" \
            "/api/tools?limit=6&pricing=free" \
            "/api/tools/new?limit=8" \
            "/api/tools/trending?limit=6" \
            "/api/free-tools?limit=6" \
            "/api/news?limit=8" \
            "/api/blogs?limit=12" \
            "/api/prompts?limit=12" \
            "/sitemap.xml" \
            "/rss.xml" ; do
            body=$(curl -s -m 20 -w '\n%{http_code}' "$W$p")
            code=$(printf '%s' "$body" | tail -n1)
            echo "  $code  $p"
            if [ "$code" = "200" ]; then ok=$((ok+1))
            elif printf '%s' "$body" | grep -q "exceeded D1"; then quota=$((quota+1))
            else bad=$((bad+1)); fi
          done
          echo "warmed $ok | quota-blocked $quota | other failures $bad"
          # This step must not decide whether the site gets published. Failing it
          # skips the deploy-pages job, which is how /blog and /prompts stayed
          # 404 after the 20de337 push: the worker deployed, the warm step failed
          # on an exhausted D1 quota, and Pages never ran.
          if [ "$ok" != "0" ]; then exit 0; fi
          if [ "$bad" = "0" ] && [ "$quota" != "0" ]; then
            echo "Nothing could be warmed because the D1 read quota is exhausted."
            echo "That is not a deploy failure - the cache fills in on a later pass."
            exit 0
          fi
          echo "Nothing answered and no D1 quota error was reported: the worker deploy looks broken."
          exit 1

  pages:
    name: Publish site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=ai-directory-v5-radwan648 --branch=main
