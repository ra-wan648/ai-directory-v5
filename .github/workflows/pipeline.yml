name: AI Directory Pipeline
on:
  schedule:
    - cron: '0 2 * * 0,1,3,4,5,6'
  workflow_dispatch:
# Needed only for the heartbeat commit at the end of the job.
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser playwright apify-client python-telegram-bot
      - name: Install wrangler
        run: npm install -g wrangler
      # Idempotent: every statement is IF NOT EXISTS. Applying it each pass
      # keeps the indexes in place even if the database is rebuilt from
      # schema.sql, and it is metadata work, not a table scan.
      - name: Apply D1 indexes
        run: wrangler d1 execute ai-directory-db --remote --file=migrations/001_indexes.sql
        env:
          CF_API_TOKEN: ${{secrets.CF_API_TOKEN}}
          CLOUDFLARE_ACCOUNT_ID: ${{secrets.CF_ACCOUNT_ID}}

      - name: Delete synthetic tools
        run: cd scripts && python delete_synthetic.py
        env:
          CF_API_TOKEN: ${{secrets.CF_API_TOKEN}}
          CLOUDFLARE_ACCOUNT_ID: ${{secrets.CF_ACCOUNT_ID}}
      # Keys are read as APIFY_KEY_1..APIFY_KEY_N and the sites are auto-distributed.
      # Slots 1-8 are wired up here; add APIFY_KEY_9 and beyond if you ever need
      # more. Keep them gapless: the loader stops at the first missing one, and an
      # unset secret arrives as an empty string, which stops the scan.
      - name: Apify scraper
        run: cd scripts && python apify_scraper.py
        env:
          APIFY_KEY_1: ${{secrets.APIFY_KEY_1}}
          APIFY_KEY_2: ${{secrets.APIFY_KEY_2}}
          APIFY_KEY_3: ${{secrets.APIFY_KEY_3}}
          APIFY_KEY_4: ${{secrets.APIFY_KEY_4}}
          APIFY_KEY_5: ${{secrets.APIFY_KEY_5}}
          APIFY_KEY_6: ${{secrets.APIFY_KEY_6}}
          APIFY_KEY_7: ${{secrets.APIFY_KEY_7}}
          APIFY_KEY_8: ${{secrets.APIFY_KEY_8}}
          CF_API_TOKEN: ${{secrets.CF_API_TOKEN}}
          CLOUDFLARE_ACCOUNT_ID: ${{secrets.CF_ACCOUNT_ID}}
      - name: Fresh data pipeline
        run: cd scripts && python fresh_data_pipeline.py
        env:
          PRODUCT_HUNT_KEY: ${{secrets.PRODUCT_HUNT_KEY}}
          PRODUCT_HUNT_SECRET: ${{secrets.PRODUCT_HUNT_SECRET}}
          # Source F. Skips itself cleanly when the secret is unset.
          SERPAPI_KEY: ${{secrets.SERPAPI_KEY}}
          # optional: raises the GitHub search rate limit from 60/h to 5,000/h
          GITHUB_TOKEN: ${{secrets.GH_SEARCH_TOKEN}}
          CF_API_TOKEN: ${{secrets.CF_API_TOKEN}}
          CLOUDFLARE_ACCOUNT_ID: ${{secrets.CF_ACCOUNT_ID}}
      # Optional enrichment. Skips itself cleanly when MANIFEST_API_KEY is absent.
      - name: LLM fill missing tool data
        run: python scripts/llm_fill.py
        env:
          MANIFEST_API_KEY: ${{secrets.MANIFEST_API_KEY}}
          CF_API_TOKEN: ${{secrets.CF_API_TOKEN}}
          CLOUDFLARE_ACCOUNT_ID: ${{secrets.CF_ACCOUNT_ID}}
      # always() so a failure in the step above still sends the run summary.
      - name: Telegram stats
        if: always()
        run: cd scripts && python telegram_stats.py

      # GitHub silently disables a scheduled workflow after 60 days without
      # repository activity, and this pipeline otherwise never writes to the
      # repo - so the automation everyone relies on would stop on its own with
      # no warning. This keeps the schedule alive and doubles as a run history.
      - name: Heartbeat commit
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .pipeline-heartbeat
          git config user.name  "ai-directory-bot"
          git config user.email "ai-directory-bot@users.noreply.github.com"
          git add .pipeline-heartbeat
          git commit -m "pipeline heartbeat $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "heartbeat push skipped"
        env:
          CF_API_TOKEN: ${{secrets.CF_API_TOKEN}}
          CLOUDFLARE_ACCOUNT_ID: ${{secrets.CF_ACCOUNT_ID}}
          TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
          ADMIN_TELEGRAM_ID: ${{secrets.ADMIN_TELEGRAM_ID}}
