name: SEO Enrichment

on:
  workflow_dispatch:
    inputs:
      max_tools:
        description: 'Max tools to process (0 = all)'
        required: false
        default: '500'
      batch:
        description: 'Batch label for tracking'
        required: false
        default: 'manual'

jobs:
  seo-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Run SEO enrichment
        env:
          MANIFEST_API_KEY: ${{ secrets.MANIFEST_API_KEY }}
          MANIFEST_BASE_URL: ${{ secrets.MANIFEST_BASE_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SEO_MAX: ${{ inputs.max_tools }}
        run: cd scripts && python seo_enrich.py
